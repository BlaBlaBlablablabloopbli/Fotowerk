name: Fotowerk bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: App bauen
        run: gradle assembleRelease --no-daemon
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Fotowerk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fotowerk-APK
          path: Fotowerk.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fotowerk ${{ github.run_number }}
          files: Fotowerk.apk
